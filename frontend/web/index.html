<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Organize and monitor household chores, assignments, due dates, and reminders.">
  <meta name="theme-color" content="#00796B">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Household Chores">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Household Chores</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    (async function () {
      function loadScript(src) {
        return new Promise((resolve, reject) => {
          const script = document.createElement("script");
          script.src = src;
          script.onload = resolve;
          script.onerror = reject;
          document.body.appendChild(script);
        });
      }

      let buildId = Date.now().toString();
      try {
        const response = await fetch(`/version.json?ts=${Date.now()}`, {
          cache: "no-store",
        });
        if (response.ok) {
          const version = await response.json();
          buildId = version.buildId || version.version || buildId;
        }
      } catch (_) {
        // Fall back to a timestamp so cache-busting still works offline-ish.
      }

      const suffix = `?v=${encodeURIComponent(buildId)}`;
      await loadScript(`config.js${suffix}`);
      await loadScript(`app_update.js${suffix}`);
      await loadScript(`flutter_bootstrap.js${suffix}`);
    })();
  </script>
</body>
</html>
