server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Flutter web uses client-side routing. Unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-lived cache for hashed static assets.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # No cache for the app shell so updates are picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Runtime config should be easy to change between deployments.
    location = /config.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Android packages served from the install page.
    location ~* \.apk$ {
        default_type application/vnd.android.package-archive;
        add_header Cache-Control "no-cache";
    }

    # Gzip for faster page loads.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
